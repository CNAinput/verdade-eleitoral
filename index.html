<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Registo de todos os resultados eleitorais verdadeiros e oficiais da CNA.">
<title>Verdade Eleitoral</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="css/site.css">
<script src="js/tema.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="salto" href="#conteudo">Saltar para o conteúdo</a>
<header class="topo">
  <div class="miolo">
    <a class="marca" href="#/" aria-label="Verdade Eleitoral, página inicial">
      <img class="logo-claro" src="img/logo.png" alt="Verdade Eleitoral" width="504" height="167" loading="lazy">
      <img class="logo-escuro" src="img/logo-escuro.png" alt="" width="504" height="167" loading="lazy">
    </a>
    <button id="tema" class="interruptor" type="button" role="switch" aria-checked="false" aria-label="Modo escuro" title="Alternar entre modo claro e escuro">
      <span class="interruptor-estrelas" aria-hidden="true"></span>
      <span class="interruptor-bola" aria-hidden="true">
        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="1.5" x2="12" y2="3.5"/>
            <line x1="12" y1="20.5" x2="12" y2="22.5"/>
            <line x1="1.5" y1="12" x2="3.5" y2="12"/>
            <line x1="20.5" y1="12" x2="22.5" y2="12"/>
            <line x1="4.6" y1="4.6" x2="6" y2="6"/>
            <line x1="18" y1="18" x2="19.4" y2="19.4"/>
            <line x1="4.6" y1="19.4" x2="6" y2="18"/>
            <line x1="18" y1="6" x2="19.4" y2="4.6"/>
          </g>
        </svg>
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor"/>
        </svg>
      </span>
    </button>
  </div>
</header>
<main id="conteudo" class="miolo" tabindex="-1">
  <noscript>
    <p class="aviso">Este site precisa de JavaScript para mostrar os resultados.</p>
  </noscript>
  <p class="aviso arranque">Os resultados não carregaram. Experimenta recarregar a página com Ctrl+F5.</p>
</main>
<footer class="rodape">
  <div class="miolo">
    <p>Registo de todos os resultados eleitorais verdadeiros e oficiais da CNA.</p>
    <p>Um projeto do INPUT, Instituto de Plataformas e Utilidades Tecnológicas da CNA.</p>
  </div>
</footer>
<div id="anuncios" class="so-leitores" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
